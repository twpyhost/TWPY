<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/colors.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/typography.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/spacing.css">

<style>
doc-page:not(:defined){visibility:hidden}
a{color:var(--accent-primary);text-decoration:none}
a:hover{color:var(--accent-cyan)}
</style>
<script src="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/_ds_bundle.js"></script>

<script src="./image-slot.js"></script>
</helmet>
<doc-page>
<section class="page" id="flier" data-screen-label="Flier" style="position:relative;overflow:hidden;background:#000;color:#fff;font-family:var(--font-body,'Source Sans 3',sans-serif)">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 8%, rgb(20,44,56) 0%, rgb(6,16,22) 45%, #000 100%)"></div>
  <div style="position:absolute;left:-14%;top:-8%;width:70%;height:48%;background:radial-gradient(circle at 40% 40%, rgba(230,0,0,.55) 0%, rgba(230,0,0,.14) 45%, transparent 72%);filter:blur(6px)"></div>
  <div style="position:absolute;right:-14%;top:-8%;width:70%;height:48%;background:radial-gradient(circle at 60% 40%, rgba(63,209,231,.5) 0%, rgba(30,120,220,.16) 45%, transparent 72%);filter:blur(6px)"></div>
  <div style="position:absolute;left:0;bottom:-6%;width:60%;height:42%;background:radial-gradient(circle at 35% 70%, rgba(245,10,100,.28) 0%, transparent 70%)"></div>
  <div style="position:absolute;right:0;bottom:-6%;width:60%;height:42%;background:radial-gradient(circle at 65% 70%, rgba(120,60,200,.3) 0%, transparent 70%)"></div>


  <img src="uploads/jun-faded.png" alt="Jun Kazama" style="position:absolute;left:-4%;bottom:0;width:37%;filter:saturate(1.05) contrast(1.05)">
  <img src="uploads/king-faded.png" alt="King" style="position:absolute;right:-4%;bottom:0;width:37%;filter:saturate(1.05) contrast(1.05)">


  <img src="uploads/jin-faded.png" alt="Jin Kazama" style="position:absolute;left:-3%;top:0;width:40%;filter:saturate(1.05) contrast(1.05)">
  <img src="uploads/kazuya-faded.png" alt="Kazuya Mishima" style="position:absolute;right:-3%;top:0;width:40%;filter:saturate(1.05) contrast(1.05)">
  <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.12) 0%, rgba(0,0,0,.38) 38%, rgba(0,0,0,.6) 62%, rgba(0,0,0,.74) 100%)"></div>



  <div style="position:relative;z-index:3;height:100%;box-sizing:border-box;padding:5% 6% 4.5%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center">

    <div style="display:flex;flex-direction:column;align-items:center;margin-top:-1cqw">
      <img src="uploads/tekken8-logo-cropped.png" alt="TEKKEN 8" style="width:46cqw;height:auto;display:block;filter:drop-shadow(0 0 16px rgba(245,10,100,.5))">
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:0.4cqw">
      <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:4.6cqw;letter-spacing:.22em;line-height:1;color:#fff">INICIO DE LA</div>
      <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-style:italic;font-size:10.2cqw;line-height:.9;letter-spacing:-.01em;white-space:nowrap;color:#fff;text-shadow:0 0 36px rgba(230,0,0,.75), 0 0 90px rgba(245,10,100,.45)">LIGA INVITACIONAL</div>
      <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:3.6cqw;letter-spacing:.2em;line-height:1;color:rgba(255,255,255,.86)">DE TEKKEN PARAGUAY</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:0.6cqw">
      <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:3cqw;letter-spacing:.32em;line-height:1;color:rgba(255,255,255,.7)">ORGANIZA</div>
      <img src="uploads/TWPY%20LOGO%20VARIANTES-04.png" alt="Tekken Warriors Paraguay" style="height:30cqw;width:auto;display:block;filter:drop-shadow(0 0 26px rgba(255,255,255,.28)) drop-shadow(0 0 40px rgba(230,0,0,.35))">
    </div>

    <div style="width:86%;box-sizing:border-box;border:0.35cqw solid rgb(var(--color-primary-500));background:rgba(0,0,0,.72);box-shadow:0 0 30px rgba(245,10,100,.35);padding:2.2cqw 2cqw;display:flex;align-items:center;justify-content:center;gap:2.4cqw">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:.2cqw">
        <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:2.9cqw;letter-spacing:.2em;color:rgb(var(--color-primary-500));line-height:1">INICIA:</div>
        <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:6.4cqw;letter-spacing:.04em;line-height:1;display:flex;align-items:baseline;gap:1cqw">DOMINGO <span style="color:rgb(var(--color-primary-500));font-size:8cqw">9</span></div>
      </div>
      <div style="width:.3cqw;height:9cqw;background:linear-gradient(to bottom, transparent, rgba(245,10,100,.9), transparent)"></div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:.2cqw">
        <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:4.6cqw;letter-spacing:.1em;line-height:1">AGOSTO</div>
        <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:4.6cqw;letter-spacing:.06em;line-height:1;color:rgb(var(--color-tekken-blue-400))">17:00 HS</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:1.4cqw">
      <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:5.2cqw;letter-spacing:.14em;line-height:1;text-shadow:0 0 24px rgba(63,209,231,.5)">TRANSMISIONES EN DIRECTO</div>
      <div style="display:flex;align-items:center;gap:1.6cqw;background:rgba(0,0,0,.7);border:0.14cqw solid rgba(255,255,255,.18);padding:1.1cqw 2.4cqw">
        <svg viewBox="0 0 20 20" style="width:4.6cqw;height:4.6cqw;fill:#9146FF;filter:drop-shadow(0 0 10px rgba(145,70,255,.7))" aria-label="Twitch"><path fill-rule="evenodd" d="M2.149 0L.5 4.119v13.36h4.943V20h2.748l2.472-2.521h3.847L20 12.36V0H2.149zm1.647 1.65h14.56v9.885l-2.885 2.884H11.62l-2.472 2.472v-2.472H3.796V1.65zm4.943 8.236h1.646V4.944H8.739v4.942zm4.518 0h1.647V4.944h-1.647v4.942z"></path></svg>
        <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:5cqw;letter-spacing:.06em;line-height:1">Focus_Pocus_</div>
      </div>
    </div>

    <sc-if value="{{ showSponsors }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:1.4cqw;width:100%">
        <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:3.2cqw;letter-spacing:.32em;color:rgba(255,255,255,.7);line-height:1">ACOMPAÑAN</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;width:100%">
          <div style="position:relative;height:11cqw">
            <img src="uploads/GLOBALBOX%20COLOR%202026%20vector-02%20(1).png" alt="globalBox" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26cqw;height:20cqw;object-fit:contain">
          </div>
          <div style="position:relative;height:11cqw">
            <img src="uploads/dannsblanco.png" alt="The Dann's Box" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:23cqw;width:auto;object-fit:contain">
          </div>
          <div style="position:relative;height:11cqw">
            <img src="uploads/VECTORES_Mesa de trabajo 1.png" alt="Serial Center" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30cqw;height:30cqw;object-fit:contain">
          </div>
        </div>
      </div>
    </sc-if>

  </div>
</section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showSponsors&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showSponsors: this.props.showSponsors ?? true };
  }
}
</script>
</body>
</html>
