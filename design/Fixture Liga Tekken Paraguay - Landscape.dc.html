<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/colors.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/typography.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/effects.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/styles.css">
<style>
body{margin:0}
a{color:var(--accent-primary);text-decoration:none}
a:hover{color:var(--accent-cyan)}
</style>
<script src="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
</helmet>

<div style="background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0">
  <sc-for list="{{ fechas }}" as="fecha" hint-placeholder-count="3">
    <div data-screen-label="Fecha {{ fecha.n }}" style="position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;background:#000;color:#fff;font-family:var(--font-body,'Source Sans 3',sans-serif)">
      <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%, rgb(20,44,56) 0%, rgb(6,16,22) 48%, #000 100%)"></div>
      <div style="position:absolute;left:-10%;top:-16%;width:55%;height:60%;background:radial-gradient(circle at 45% 45%, rgba(230,0,0,.38) 0%, rgba(230,0,0,.1) 45%, transparent 72%);filter:blur(10px)"></div>
      <div style="position:absolute;right:-10%;top:-16%;width:55%;height:60%;background:radial-gradient(circle at 55% 45%, rgba(63,209,231,.36) 0%, rgba(30,120,220,.12) 45%, transparent 72%);filter:blur(10px)"></div>
      <div style="position:absolute;left:0;bottom:-14%;width:100%;height:42%;background:radial-gradient(60% 100% at 50% 90%, rgba(245,10,100,.2) 0%, transparent 70%)"></div>

      <div style="position:relative;z-index:3;height:100%;box-sizing:border-box;padding:56px 70px;display:flex;flex-direction:column;gap:28px">

        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:36px;border-bottom:2px solid rgba(255,255,255,.14);padding-bottom:18px">
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="display:inline-flex;align-self:flex-start;background:rgb(var(--color-primary-500));clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);padding:6px 28px">
              <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:20px;letter-spacing:.28em;color:#fff">LIGA INVITACIONAL &middot; TEKKEN PARAGUAY</span>
            </div>
            <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-style:italic;font-size:118px;line-height:.9;letter-spacing:.01em;margin-left:-4px;text-shadow:0 0 30px rgba(230,0,0,.7), 0 0 80px rgba(245,10,100,.45)">FECHA {{ fecha.n }}</div>
          </div>

          <div style="display:flex;align-items:center;gap:28px">
            <div style="box-sizing:border-box;border:3px solid rgb(var(--color-primary-500));background:rgba(0,0,0,.72);box-shadow:0 0 30px rgba(245,10,100,.3);padding:16px 30px">
              <div style="display:flex;flex-direction:column;gap:2px">
                <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:30px;letter-spacing:.06em;line-height:1;display:block">{{ fecha.date }}</span>
                <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:26px;letter-spacing:.08em;line-height:1;color:rgb(var(--color-tekken-blue-400));display:block">{{ fecha.time }}</span>
              </div>
            </div>
            <img src="uploads/TWPY%20LOGO%20VARIANTES-04-bbddaf3b.png" alt="Tekken Warriors Paraguay" style="height:150px;width:auto;flex:none;display:block;filter:drop-shadow(0 0 20px rgba(255,255,255,.25))">
          </div>
        </div>

        <div style="{{ fecha.groupsGridStyle }}">
          <sc-for list="{{ fecha.groups }}" as="group" hint-placeholder-count="3">
            <div style="display:flex;flex-direction:column;gap:14px;min-height:0">
              <div style="background:rgb(var(--color-primary-500));clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);padding:9px 0;text-align:center;box-shadow:0 2px 20px rgba(245,10,100,.5)">
                <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:32px;letter-spacing:.2em;color:#fff">{{ group.label }}</span>
              </div>

              <div style="flex:1;display:flex;flex-direction:column;gap:14px;min-height:0">
                <sc-for list="{{ group.matches }}" as="m" hint-placeholder-count="3">
                  <div style="flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05);border-left:4px solid rgb(var(--color-primary-500));padding:0 16px">
                    <div style="flex:1;display:flex;align-items:center;gap:12px;min-width:0">
                      <sc-if value="{{ showCharacters }}" hint-placeholder-val="{{ true }}">
                        <div style="width:74px;height:74px;flex:none;box-sizing:border-box;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.04);overflow:hidden">
                          <img src="{{ m.a.img }}" alt="{{ m.a.char }}" style="width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block">
                        </div>
                      </sc-if>
                      <div style="display:flex;flex-direction:column;min-width:0">
                        <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:{{ m.a.fontSize }}px;line-height:1.05;letter-spacing:0;overflow-wrap:break-word;white-space:{{ m.a.whiteSpace }};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ m.a.name }}</span>
                        <span style="font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);display:block">{{ m.a.char }}</span>
                      </div>
                    </div>

                    <div style="flex:none;background:rgb(var(--color-tekken-blue-400));clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);padding:4px 12px">
                      <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:18px;letter-spacing:.1em;color:#06171d">VS</span>
                    </div>

                    <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0">
                      <div style="display:flex;flex-direction:column;align-items:flex-end;min-width:0">
                        <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:{{ m.b.fontSize }}px;line-height:1.05;letter-spacing:0;overflow-wrap:break-word;white-space:{{ m.b.whiteSpace }};text-align:right;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ m.b.name }}</span>
                        <span style="font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);display:block">{{ m.b.char }}</span>
                      </div>
                      <sc-if value="{{ showCharacters }}" hint-placeholder-val="{{ true }}">
                        <div style="width:74px;height:74px;flex:none;box-sizing:border-box;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.04);overflow:hidden">
                          <img src="{{ m.b.img }}" alt="{{ m.b.char }}" style="width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block">
                        </div>
                      </sc-if>
                    </div>
                  </div>
                </sc-for>

                <div style="display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.25);padding:14px 0">
                  <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:18px;letter-spacing:.22em;color:rgba(255,255,255,.55)">DESCANSA</span>
                  <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:24px;letter-spacing:.04em;color:rgba(255,255,255,.85)">{{ group.descansa.name }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:2px solid rgba(255,255,255,.14);padding-top:16px">
          <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:22px;letter-spacing:.24em;color:rgba(255,255,255,.62)">TEMPORADA 2026</span>
          <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:22px;letter-spacing:.24em;color:rgb(var(--color-primary-500))">TEKKEN WARRIORS PARAGUAY</span>
        </div>
      </div>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showCharacters&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const CHAR = {

function fontSizeFor(name) {
  const hasSpace = name.indexOf(' ') !== -1;
  const len = name.length;
  if (!hasSpace) {
    if (len <= 9) return 31;
    if (len <= 12) return 24;
    return 20;
  }
  if (len <= 12) return 31;
  if (len <= 18) return 26;
  return 22;
}

function p(name) {
  const c = CHAR[name] || ['', ''];
  const hasSpace = name.indexOf(' ') !== -1;
  return { name, char: c[0], img: c[1] ? ('uploads/' + c[1]) : '', fontSize: fontSizeFor(name), whiteSpace: hasSpace ? 'normal' : 'nowrap' };
}
function m(a, b) { return { a: p(a), b: p(b) }; }

  { n: 3, date: 'DOMINGO 23/08', time: '17:00 HS', groups: [

    { label: 'GRUPO 3', matches: [m('Danns', 'Dijeorama'), m('Tsuki', 'Ayrlex'), m('Rim', 'Roxer')], descansa: p('Hosco') },
    { label: 'GRUPO 4', matches: [m('Lightgear', 'Gonza'), m('Lagann', 'Aagony'), m('The Last Outlaw', 'Pat')], descansa: p('Rushador Cuidadoso') },
  ]},
  { n: 4, date: 'DOMINGO 30/08', time: '17:00 HS', groups: [

    { label: 'GRUPO 2', matches: [m('Damian', 'Yuya'), m('FatE', 'Gotenks'), m('Overlord', 'Pavel')], descansa: p('Kurosu') },

  { n: 5, date: 'DOMINGO 06/09', time: '17:00 HS', groups: [
    { label: 'GRUPO 3', matches: [m('Hosco', 'Dijeorama'), m('Tsuki', 'Rim'), m('Ayrlex', 'Roxer')], descansa: p('Danns') },

    { label: 'GRUPO 4', matches: [m('Rushador Cuidadoso', 'The Last Outlaw'), m('Lightgear', 'Pat'), m('Gonza', 'Aagony')], descansa: p('Lagann') },
  ]},
  { n: 11, date: 'DOMINGO 18/10', time: '17:00 HS', groups: [

class Component extends DCLogic {
  renderVals() {
    return {
      fechas: FECHAS_RAW.map(f => ({
        ...f,
        groupsGridStyle: f.groups.length < 3
          ? `flex:1;display:grid;grid-template-columns:repeat(${f.groups.length},minmax(0,1fr));gap:36px;min-height:0;width:calc((100% - 72px) * ${f.groups.length}/3 + ${(f.groups.length - 1) * 36}px);margin:0 auto`

      })),
      showCharacters: this.props.showCharacters ?? true,
    };
  }
}

</script>

</html>
