<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/colors.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/typography.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/effects.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/styles.css">
<style>
body{margin:0}
a{color:var(--accent-primary);text-decoration:none}
a:hover{color:var(--accent-cyan)}
</style>
<script src="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/_ds_bundle.js"></script>
</helmet>
<div style="background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 0">
<section id="ranking-portada" data-screen-label="Ranking Portada" style="position:relative;width:640px;height:1350px;flex:none;overflow:hidden;background:#000;color:#fff;font-family:var(--font-body,'Source Sans 3',sans-serif)">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%, rgb(20,44,56) 0%, rgb(6,16,22) 48%, #000 100%)"></div>
  <div style="position:absolute;left:-20%;top:-14%;width:70%;height:40%;background:radial-gradient(circle at 45% 45%, rgba(230,0,0,.4) 0%, rgba(230,0,0,.1) 45%, transparent 72%);filter:blur(8px)"></div>
  <div style="position:absolute;right:-20%;top:-14%;width:70%;height:40%;background:radial-gradient(circle at 55% 45%, rgba(63,209,231,.38) 0%, rgba(30,120,220,.12) 45%, transparent 72%);filter:blur(8px)"></div>
  <div style="position:absolute;left:0;bottom:-10%;width:100%;height:35%;background:radial-gradient(60% 100% at 50% 90%, rgba(245,10,100,.22) 0%, transparent 70%)"></div>

  <div style="position:relative;z-index:3;height:100%;box-sizing:border-box;padding:34px 36px 22px;display:flex;flex-direction:column;gap:14px">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid rgba(255,255,255,.14);padding-bottom:12px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div style="display:inline-flex;align-self:flex-start;background:rgb(var(--color-primary-500));clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);padding:3px 16px">
          <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:13px;letter-spacing:.24em;line-height:1.3;color:#fff">TEMPORADA 2026 &middot; TEKKEN PARAGUAY</span>
        </div>
        <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-style:italic;font-size:58px;line-height:.92;letter-spacing:.01em;margin-left:-4px;text-shadow:0 0 30px rgba(230,0,0,.7), 0 0 80px rgba(245,10,100,.4)">RANKING</div>
      </div>
      <img src="uploads/TWPY%20LOGO%20VARIANTES-04.png" alt="Tekken Warriors Paraguay" style="height:96px;width:auto;display:block;flex:none;filter:drop-shadow(0 0 22px rgba(255,255,255,.28))">
    </div>

    <div style="display:grid;grid-template-columns:44px 1fr 58px 30px;align-items:center;gap:10px;background:rgb(var(--color-primary-500));clip-path:polygon(1.5% 0,100% 0,98.5% 100%,0 100%);padding:4px 14px;box-shadow:0 2px 20px rgba(245,10,100,.5)">
      <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:16px;letter-spacing:.16em;line-height:1;color:#fff;text-align:center">POS</span>
      <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:16px;letter-spacing:.16em;line-height:1;color:#fff">JUGADOR</span>
      <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:16px;letter-spacing:.16em;line-height:1;color:#fff;text-align:right">PTS</span>
      <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:16px;letter-spacing:.16em;line-height:1;color:#fff;text-align:center">MOV</span>
    </div>

    <div style="flex:1;display:grid;grid-template-rows:repeat(31,1fr);gap:4px;min-height:0">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="31">
        <div style="display:grid;grid-template-columns:44px 1fr 58px 30px;align-items:center;gap:10px;background:{{ r.bg }};border-left:3px solid {{ r.accent }};padding:0 12px 0 8px;min-height:0">
          <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:22px;line-height:1;text-align:center;color:{{ r.posColor }}">{{ r.pos }}</span>
          <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:21px;line-height:1.05;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{ r.nameColor }}">{{ r.name }}</span>
          <span style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:21px;line-height:1;text-align:right;color:rgb(var(--color-primary-500))">{{ r.pts }}</span>
          <span style="font-size:14px;font-weight:700;line-height:1;text-align:center;color:{{ r.movColor }}">{{ r.mov }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;border-top:2px solid rgba(255,255,255,.14);padding-top:12px">
      <div style="display:flex;align-items:center;gap:18px;font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:14px;letter-spacing:.18em;color:rgba(255,255,255,.62)">
        <span style="display:flex;align-items:center;gap:5px"><span style="color:rgb(63,209,231);font-family:var(--font-body,'Source Sans 3',sans-serif);font-weight:700">&uarr;</span> SUBE</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="color:rgb(var(--color-primary-500));font-family:var(--font-body,'Source Sans 3',sans-serif);font-weight:700">&darr;</span> BAJA</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="color:rgba(255,255,255,.45);font-family:var(--font-body,'Source Sans 3',sans-serif);font-weight:700">=</span> IGUAL</span>
        <span>31 RANKEADOS</span>
      </div>
      <div style="font-family:var(--font-display,'Bebas Neue',sans-serif);font-size:15px;letter-spacing:.2em;color:rgb(var(--color-primary-500))">TEKKEN WARRIORS PARAGUAY</div>
    </div>

  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const DATA = [
  [1,'RushadorCuidadoso',1350,'='],
  [2,'DEER_Hosco',1110,'up'],
  [3,'Danns_',1090,'down'],
  [4,'WARIOTWPY',1000,'down'],
  [5,'gonzykkes',830,'='],
  [6,"Mandi'o Colo",820,'up'],
  [7,'SaikeN',660,'down'],
  [8,'TrunksEsp',420,'='],
  [9,'DamianCp',400,'='],
  [10,'Yuyincarlos',370,'='],
  [11,'LMDTLightGear',360,'up'],
  [12,'TWPY | tsukigazin',330,'down'],
  [13,'TWPY_ROX',300,'up'],
  [14,'Peepo_Rolon93',250,'down'],
  [15,'RVNT I DSS',220,'down'],
  [16,'Jarrinqui',190,'='],
  [17,'SsnakePy86',180,'='],
  [18,'Gsus1801',140,'='],
  [19,'Lagann18',130,'up'],
  [20,'TWPYShaka',120,'down'],
  [21,'TWPYpalolo',120,'down'],
  [22,'Serafin',110,'down'],
  [23,'Focus_Pocus_',100,'down'],
  [24,'TWPYNucita',100,'down'],
  [25,'Salwafle',90,'down'],
  [26,'ssnakepy',90,'down'],
  [27,'TWPYpollito',80,'down'],
  [28,'Myers',70,'down'],
  [29,'JJ',70,'down'],
  [30,'KikeCarlsen',70,'down'],
  [31,'Dragon_sex',70,'down']
];

class Component extends DCLogic {
  renderVals() {
    const rows = DATA.map(([pos, name, pts, mov]) => {
      const top = pos <= 3;
      return {
        pos, name, pts,
        mov: mov === 'up' ? '\u2191' : mov === 'down' ? '\u2193' : '=',
        movColor: mov === 'up' ? 'rgb(63,209,231)' : mov === 'down' ? 'rgb(245,10,100)' : 'rgba(255,255,255,.42)',
        bg: top ? 'rgba(245,10,100,.16)' : 'rgba(255,255,255,.05)',
        accent: top ? 'rgb(63,209,231)' : 'rgb(245,10,100)',
        posColor: top ? '#fff' : 'rgba(255,255,255,.55)',
        nameColor: top ? '#fff' : 'rgba(255,255,255,.92)'
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
