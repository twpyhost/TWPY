<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/colors.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/typography.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/tokens/effects.css">
<link rel="stylesheet" href="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/styles.css">
<style>
body{margin:0;background:#03080c}
a{color:rgb(var(--color-primary-500));text-decoration:none}
a:hover{color:rgb(var(--color-tekken-blue-400))}
input::placeholder{color:rgba(10,16,22,.42);font-family:'Source Sans 3',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{opacity:.45}50%{opacity:.85}}
</style>
<script src="_ds/tekken-8-design-system-a208c36d-90bf-49d5-8497-10656e55698d/_ds_bundle.js"></script>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;font-family:'Source Sans 3',sans-serif;color:#fff;background:radial-gradient(120% 90% at 15% 0%,#2b0f27 0%,#0c232c 45%,#030f14 100%);overflow-x:clip" data-screen-label="Login">

  <div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(45% 45% at 82% 78%,rgba(63,209,231,.16) 0%,transparent 70%),radial-gradient(40% 40% at 12% 20%,rgba(245,10,100,.18) 0%,transparent 70%);animation:glowPulse 7s ease-in-out infinite"></div>

  <nav style="position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 clamp(20px,4vw,56px);border-bottom:1px solid rgba(255,255,255,.07)">
    <a href="./Home Liga Tekken Paraguay.dc.html" style="display:flex;align-items:center;gap:12px;color:#fff">
      <img src="uploads/TWPY LOGO VARIANTES-04.png" alt="Tekken Warriors Paraguay" style="height:40px;width:auto;display:block">
    </a>
    <a href="./Home Liga Tekken Paraguay.dc.html" style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.06em;font-style:italic;color:rgba(255,255,255,.7)" style-hover="color:rgb(var(--color-primary-500))">← VOLVER AL INICIO</a>
  </nav>

  <main style="position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(32px,6vw,72px) clamp(20px,5vw,48px)">

    <div style="{{ gridStyle }}">

      <div style="display:flex;flex-direction:column;gap:20px;animation:fadeUp .6s var(--ease-decelerate,ease-out) both;order:{{ textOrder }}">
        <div style="align-self:flex-start;background:rgb(var(--color-primary-500));clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:6px 26px">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.16em;color:#fff">LIGA TEKKEN PARAGUAY</span>
        </div>
        <h1 style="margin:0;font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:clamp(52px,7vw,86px);line-height:.92;letter-spacing:.01em;text-wrap:balance">ENTRÁ A LA<br><span style="color:rgb(var(--color-primary-500))">ARENA</span></h1>
        <p style="margin:0;max-width:420px;font-size:16px;line-height:1.65;color:rgba(255,255,255,.72)">Accedé a tu cuenta para inscribirte a los torneos, seguir tu ranking y ver tus próximos combates del fixture.</p>
        <div style="display:flex;gap:36px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)">
          <div style="display:flex;flex-direction:column">
            <span style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;color:rgb(var(--color-tekken-blue-400))">15+</span>
            <span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)">Años de liga</span>
          </div>
          <div style="display:flex;flex-direction:column">
            <span style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;color:rgb(var(--color-tekken-blue-400))">32</span>
            <span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)">Competidores</span>
          </div>
        </div>
      </div>

      <div style="position:relative;animation:fadeUp .7s var(--ease-decelerate,ease-out) both;order:{{ formOrder }}">
        <div style="position:absolute;left:0;right:14%;top:-6px;height:6px;background:rgb(var(--color-primary-500));box-shadow:0 0 22px rgba(245,10,100,.6)"></div>
        <div style="position:absolute;left:26%;right:0;bottom:-6px;height:6px;background:rgb(var(--color-tekken-blue-400));box-shadow:0 0 22px rgba(63,209,231,.5)"></div>

        <form onSubmit="{{ submit }}" style="background:rgb(var(--color-black-500));border:1px solid rgba(255,255,255,.07);padding:clamp(30px,4vw,44px) clamp(26px,3.5vw,40px);display:flex;flex-direction:column;gap:22px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
            <span style="font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:24px;letter-spacing:.1em;color:rgb(var(--color-primary-500))">TWPY</span>
            <h2 style="margin:0;font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:54px;line-height:1;letter-spacing:.01em">LOGIN</h2>
          </div>

          <label style="display:flex;flex-direction:column;gap:8px">
            <span style="font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:19px;letter-spacing:.05em;color:#fff">CORREO</span>
            <input type="email" placeholder="correo@example.com" style="width:100%;box-sizing:border-box;height:50px;padding:0 16px;border:2px solid transparent;background:#f1f2f3;color:#0a1016;font-size:15px;font-family:'Source Sans 3',sans-serif;outline:none;transition:border-color .25s var(--ease-standard),box-shadow .25s var(--ease-standard)" style-focus="border-color:rgb(var(--color-primary-500));box-shadow:0 0 0 4px rgba(245,10,100,.18)">
          </label>

          <label style="display:flex;flex-direction:column;gap:8px">
            <span style="font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:19px;letter-spacing:.05em;color:#fff">PASSWORD</span>
            <input type="password" placeholder="Ingresar password" style="width:100%;box-sizing:border-box;height:50px;padding:0 16px;border:2px solid transparent;background:#f1f2f3;color:#0a1016;font-size:15px;font-family:'Source Sans 3',sans-serif;outline:none;transition:border-color .25s var(--ease-standard),box-shadow .25s var(--ease-standard)" style-focus="border-color:rgb(var(--color-primary-500));box-shadow:0 0 0 4px rgba(245,10,100,.18)">
          </label>

          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:-6px">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.65);cursor:pointer">
              <input type="checkbox" style="width:16px;height:16px;accent-color:rgb(var(--color-primary-500));margin:0">
              Recordarme
            </label>
            <a href="#" style="font-size:13px;font-weight:700;color:rgb(var(--color-tekken-blue-400))">¿Olvidaste tu password?</a>
          </div>

          <button type="submit" style="width:100%;height:56px;border:2px solid transparent;background:rgb(var(--color-primary-500));color:#fff;font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:26px;letter-spacing:.06em;cursor:pointer;box-shadow:0 2px 20px rgba(245,10,100,.5);transition:filter .25s var(--ease-standard),border-color .25s var(--ease-standard)" style-hover="filter:brightness(80%);border-color:#000">INGRESAR</button>

          <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.3);font-size:11px;letter-spacing:.14em">
            <span style="flex:1;height:1px;background:rgba(255,255,255,.12)"></span>O
            <span style="flex:1;height:1px;background:rgba(255,255,255,.12)"></span>
          </div>

          <a href="#" style="display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.06em;color:#fff;transition:background .25s var(--ease-standard),border-color .25s var(--ease-standard)" style-hover="background:rgba(88,101,242,.16);border-color:#5865F2;color:#fff">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="#5865F2"><path d="M20.317 4.369A19.79 19.79 0 0 0 15.885 3c-.211.375-.457.881-.63 1.283a18.27 18.27 0 0 0-5.51 0A11.5 11.5 0 0 0 9.115 3 19.79 19.79 0 0 0 4.683 4.369C1.61 8.86.79 13.24 1.16 17.56a19.9 19.9 0 0 0 5.993 3.04c.483-.66.913-1.36 1.28-2.098a12.9 12.9 0 0 1-2.02-.98c.17-.125.336-.256.497-.39 3.797 1.75 7.898 1.75 11.652 0 .163.134.328.265.497.39-.643.383-1.32.71-2.02.98.367.737.797 1.437 1.28 2.098a19.86 19.86 0 0 0 5.993-3.04c.44-4.998-.738-9.337-2.995-13.19ZM8.68 14.81c-.99 0-1.8-.916-1.8-2.045 0-1.13.79-2.046 1.8-2.046 1.02 0 1.827.926 1.8 2.046 0 1.13-.79 2.045-1.8 2.045Zm6.64 0c-.99 0-1.8-.916-1.8-2.045 0-1.13.79-2.046 1.8-2.046 1.02 0 1.826.926 1.8 2.046 0 1.13-.78 2.045-1.8 2.045Z"></path></svg>
            CONTINUAR CON DISCORD
          </a>

          <p style="margin:0;text-align:center;font-size:14px;color:rgba(255,255,255,.6)">¿No tenés cuenta? <a href="#" style="font-weight:700;font-style:italic;color:rgb(var(--color-primary-500))">Registrate</a></p>
        </form>
      </div>

    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mobile: false };

  componentDidMount() {
    this._rz = () => this.setState({ mobile: window.innerWidth < 780 });
    this._rz();
    window.addEventListener('resize', this._rz);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._rz);
  }

  renderVals() {
    const m = this.state.mobile;
    return {
      submit: (e) => e.preventDefault(),
      gridStyle: m
        ? 'width:100%;max-width:1020px;display:grid;grid-template-columns:1fr;gap:clamp(28px,7vw,40px);align-items:stretch'
        : 'width:100%;max-width:1020px;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:clamp(32px,5vw,64px);align-items:center',
      textOrder: m ? '1' : '0',
      formOrder: m ? '0' : '1'
    };
  }
}

</script>
</body>
</html>
