name: Backup Supabase

# El free tier de Supabase no incluye backups restaurables (eso es Pro/PITR).
# Tras el backfill historico, la base es el archivo irreemplazable de la
# escena paraguaya -- este dump semanal es la unica red de seguridad real.
on:
  schedule:
    - cron: "0 6 * * 0" # semanal, domingo 06:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        id: dump
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        # --schema=public: los schemas internos de Supabase (auth, storage,
        # extensions, etc.) son propiedad de roles que este dump no puede
        # restaurar de todas formas (probado localmente: un dump completo
        # tira "must be owner of table..." al restaurar). Lo que importa
        # preservar -- el archivo de la comunidad -- vive todo en public.
        run: |
          : "${SUPABASE_DB_URL:?Configure SUPABASE_DB_URL in repository or Production environment secrets}"
          : "${BACKUP_ENCRYPTION_KEY:?Configure BACKUP_ENCRYPTION_KEY before publishing archive support}"
          # Preserve GRANT/REVOKE so service-only RPCs stay private after restore.
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --clean --if-exists \
            > "$RUNNER_TEMP/supabase-public.sql"
          test -s "$RUNNER_TEMP/supabase-public.sql"
          gzip -c "$RUNNER_TEMP/supabase-public.sql" > "backup-$(date -u +%Y-%m-%d).sql.gz"
          gzip -t "backup-$(date -u +%Y-%m-%d).sql.gz"
          # Public repository artifacts must never contain plaintext drafts.
          node scripts/backupCrypto.js encrypt "backup-$(date -u +%Y-%m-%d).sql.gz" "backup-$(date -u +%Y-%m-%d).sql.gz.enc"

      - name: Upload artifact
        id: upload
        if: steps.dump.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.sql.gz.enc
          if-no-files-found: error
          # Maximo permitido sin configuracion adicional a nivel org/repo.
          retention-days: 90

      - name: Registrar el evento en sistema_eventos
        # if: always() -- corre tanto si el backup salio bien como si fallo,
        # para que /admin/sistema muestre el estado real (y no "sin datos"
        # eternamente si un run llega a fallar).
        if: always()
        run: |
          curl -f -X POST -H "x-health-secret: ${{ secrets.HEALTH_PING_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"ok\": ${{ steps.dump.outcome == 'success' && steps.upload.outcome == 'success' }}}" \
            "${{ vars.SITE_URL }}/api/admin/sistema/backup"
