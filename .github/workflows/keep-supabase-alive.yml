name: Keep Supabase Alive

# Supabase free tier pausa el proyecto tras 7 dias sin actividad de DB.
# /api/health hace una query real (no solo responde 200), asi que este
# ping diario alcanza con margen de sobra para evitar la pausa.
on:
  schedule:
    - cron: "0 12 * * *" # diario a las 12:00 UTC
  workflow_dispatch: # permite disparo manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check required config
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::Repo variable SITE_URL is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${{ secrets.HEALTH_PING_SECRET }}" ]; then
            echo "::error::Repo secret HEALTH_PING_SECRET is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
      - name: Hit health check
        run: |
          curl -f -H "x-health-secret: ${{ secrets.HEALTH_PING_SECRET }}" \
            "${{ vars.SITE_URL }}/api/health"
